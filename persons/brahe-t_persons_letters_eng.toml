  sortname = "Wittich, Paul"
  lifetime = "1546-1586"
  description = "German mathematician and astronomer from Breslau (Wrocław). Met Tycho Brahe in 1563 as a student in Leipzig. I 1580 he was assistant on Hven, where he introduced the algorithm _prosthaphaeresis_. Like Tycho he aimed at adapting Copernican astronomy to geostatic models, and thereby he may have inspired the Tychonic model. I 1584 he visited the court of Landgrave William IV in Kassel, where he, without Tycho’s knowledge, introduced several of Tycho’s technical innovations. After Wittich’s death Tycho Brahe was very keen on acquiring his copious library and finally succeeded in 1598. (Christianson 2000, 379-81)"
 
