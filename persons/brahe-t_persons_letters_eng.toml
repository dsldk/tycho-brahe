[rumpf_wolfgang_1535]
  name = "Wolfgang Siegmund Rumpf zum Wullross"
  sortname = "Rumpf, Wolfgang Siegmund"
  lifetime = "c. 1535-1605"
  description = "Austrian nobleman, imperial diplomat and politician. Grand master of the imperial court in Prague 1591-99."
 
