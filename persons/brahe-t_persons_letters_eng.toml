  sortname = "Ursus"
  lifetime = "1551-1600"
  description = "(Nicolaus Reimers Baer), German astronomer and mathematician from Dithmarschen. Served as a surveyor with Heinrich Rantzau 1574-1584. Visited Uraniborg in the retinue of Erik Lange. In 1588 he published a hypothetical model in many details similar to Tycho’s Tychonic model, which Tycho considered plagiarism. Employed as a mathematician at the Imperial court in Prague, but he fled the city at Tycho Brahe arrival, primarily because Ursus in 1597 had published an answer to Tycho’s allegations of plagiarism, _De Astronomicis Hypothesibus, Seu Systemate Mundano, Tractatus Astronomicus & Cosmographicus_, with violent personal attacks on Tycho. Ursus died before Tycho managed to complete a planned legal action."

