[sagredo_giovanni_francesco_1571]
  name = "Giovanni Francesco Sagredo"
  sortname = "Sagredo, Giovanni Francesco"
  lifetime = "1571-1620"
  description = "Italian nobleman and mathematician from Venice. Pupil of Galileo Galilei in Padova. Appears in Galileo’s dialogue _Dialogo sopra i due massimi sistemi del mondo_ (1632). A large number of letters from Sagredo to Galileo has been preserved."
 
[sascerides_gellius_1562]
  name = "Gellius Sascerides"
  sortname = "Sascerides, Gellius"
  lifetime = "1562-1612"
  description = "Danish physician, astronomer and chemist. Trusted assistant to Tycho Brahe 1582-87, working with Paracelsian chemistry as well as astronomical observations. During studies abroad in 1588-93 he acted as Tycho’s emissary, among others to the astronomer Magini in Bologna. In 1594-95 betrothed to Tycho’s daughter Magdalene but broke the engagement and was brought to trial by Tycho. Professor of medicine at Copenhagen University from 1603. (Christianson 2000, 351-53)"
 
[savile_thomas_1593]
  name = "Thomas Savile"
  sortname = "Savile, Thomas"
  lifetime = "d. 1593"
  description = "English Greek scholar, mathematician and astronomer. Taught Greek at Oxford University. He left no published works, but some Latin translations of Greek astronomical and mathematical texts have been preserved in manuscript. Kept an extensive correspondence with scholars all over Europe. Brother of the mathematician and Bible translator Henry Savile (1549-1622)."
 
[scaliger_joseph_justus_1540]
