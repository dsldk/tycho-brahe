  sortname = "Rosenkrantz, Jørgen"
  lifetime = "1523-1596"
  description = "Danish nobleman, member of the king’s council. Member of the regency from 1588. Son of Otte Holgersen Rosenkrantz and Margrethe Gans von Pulitz. Father of Holger Rosenkrantz the Learned (1574-1642)"
 
[rosenkrantz_margrethe_1561]
  name = "Margrethe Rosenkrantz"
  sortname = "Rosenkrantz, Margrethe"
  lifetime = "1552-1635"
  description = "Danish noblewoman. Married to Hans Lindenov (1542-1596). "
 
[rosensparre_oluf_1559]
