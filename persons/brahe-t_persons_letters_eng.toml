  lifetime = "1567-1646"
  description = "Holstein noblewoman. Daughter of Heinrich Rantzau (1526-98) and Christina von Halle. Married 1587 to Cai Rantzau (1566-1607)."
 
[rantzau_frantz_1555]
  name = "Frants Rantzau"
  sortname = "Rantzau, Frants"
  lifetime = "1555-1612"
  description = "Holstein nobleman. Service at the Danish court 1577-1584. Killed in the Kalmar war (1611-13). Son of Heinrich Rantzau and Christina von Halle. Brother of Gert Rantzau and Breide Rantzau. Married to Anne Rosenkrantz in 1584."
 
[rantzau_gert_1558]
  name = "Gert Rantzau"
  sortname = "Rantzau, Gert"
  lifetime = "1558-1627"
  description = "Holstein nobleman. Service at the Danish court in 1581. Held various fiefs in Denmark and Schleswig from 1584. From 1600 Governor of Schleswig-Holstein. Several military posts during the Kalmar War (1611-13). Knight 1616. Son of Heinrich Rantzau and Christina von Halle. Brother of Breide Rantzau and Frants Rantzau. Married to Thale Thott in 1590 and Dorothea Brockdorff in 1613."
 
[rantzau_henrik_1526]
  name = "Heinrich Rantzau"
  sortname = "Rantzau, Heirich"
  lifetime = "1526-1598"
  description = "Holstein nobleman, governor and major landowner.  From 1554 member of the Danish king’s council.  From 1556 governor of Schleswig-Holstein. Large scale patron of literature and science with many publications in his own name. Housed Tycho Brahe at his castle Wandsburg 1597-98. Married to Christina von Halle in 1554. Father of Breide Rantzau, Gert Rantzau and Frants Rantzau. "
 
[reden_theodor_1539]
  name = "Theodor von Reden"
  sortname = "Reden, Theodor von"
  lifetime = "1539-1597"
  description = "Burgher and alderman in Bremen."
 
[regiomontanus_johannes_1436]
  name = "Johannes Regiomontanus"
  sortname = "Regiomontanus, Johannes"
  lifetime = "1436-1476"
  description = "(Johannes Müller) German astronomer, mathematician and printer from Königsberg. Pupil of Georg Peurbach, whose translation of Ptolemy’s _Algemast_ he completed. From 1471 in Nuremberg, where he established a printing house and an observatory. In Nuremberg he published the first printed ephemerids (1474). Died in Rome working on the planned calendar reform for Sixtus IV."
 
[reinhold_erasmus_1511]
  name = "Erasmus Reinhold"
  sortname = "Reinhold, Erasmus"
  lifetime = "1511-1553"
  description = "German mathematician and astronomer. Professor of mathematics in Wittenberg from 1536. In 1551 he published the so-called Prutenic Tables, the first set of planetary tables based on the Copernikan model. "
 
[reisacher_bartholomaus_1575]
  name = "Bartholomäus Reisacher"
  sortname = "Reisacher, Bartholomäus"
  lifetime = "d. 1574"
  description = "Austrian physician, astronomer and mathematician. Physician to Emperor Maximilian II and professor of mathematics and medicine in Vienna. Wrote a treatise on the 1572 supernova: _De mirabili Nouæ ac splendissimæ Stellæ, Mense Nouembri anni 1572 primum conspectæ, ac etiam nunc apparentis, Phoenomeno_, Vienna 1573."
 
[rentfler_daniel_1587]
  name = "Daniel Rentfler"
