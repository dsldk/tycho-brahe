  description = "(Jean de Roquetaillade) French alchemist and Franciscan friar. "
 
[sacrobosco_johannes_de_1195]
  name = "Johannes de Sacrobosco"
  sortname = "Sacrobosco, Johannes de"
  lifetime = "c. 1195-c. 1256"
  description = "Learned monk and astronomer who taught at the university of Paris. Author of a work on the defects of the Julian calendar, _De Anni Ratione_, and an introduction to Ptolemaic astronomy, _Tractatus de Sphaera_."
 
[sager_johann_1592]
  name = "Johann Sager"
