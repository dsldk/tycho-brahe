  sortname = "Rantzau, Breide"
  lifetime = "1556-1618"
  description = "Holstein-Danish nobleman. Member of the Danish privy council (from 1581), governor of Copenhagen (1601).  Son of Heinrich Rantzau and Christina von Halle. Brother of Frants Rantzau and Gert Rantzau. Married to Sophie Rosenkrantz in 1579, Karen Gøye in 1598 and Christence Viffert in 1601."
 
[rantzau_elisabeth_1567]
