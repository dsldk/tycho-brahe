  lifetime = "-1598-"
  description = "Burgher in Hamburg,"
 
[rheticus_georg_joachim_1514]
  name = "Georg Joachim Rheticus"
  sortname = "Rheticus, Georg Joachim"
  lifetime = "1514-1576"
  description = "(Georg Joachim de Porris) Austrian astronomer and mathematician. 1537 professor of mathematics and astronomy at the university of Wittenberg. 1539-1541 he stayed with Copernicus in Frauenburg (Frombork). 1542-45 professor of astronomy in Leipzig. From 1554 physician in Kraków. Author of _Narratio prima_ with a description of Copernicus’ heliocentric model (1540)." 
 
[rhodius_ambrosius_1577]
  name = "Ambrosius Rhodius"
  sortname = "Rhodius, Ambrosius"
  lifetime = "1577-1633"
  description = "German mathematician, eduvated in Wittenberg. Worked as an assistant to Tycho Brahe in Prague for c. 10 months in 1600 and 1601 on the recommendation of Melchior Jöstelius. Professor of mathematics at the university of Wittenberg 1608. (Christianson 2000, 339-40)."
 
[riber_christen_hansen_1567]
  name = "Christen Hansen Riber"
  sortname = "Riber, Christen Hansen"
  lifetime = "1567-1642"
  description = "Danish astronomer and bishop. 1586-1590 assistant to Tycho Brahe on Hven. journied abroad 1591-97, the first years in the company of Ægidius Lauridsen (1568-1627), whom he taught Tycho Brahe’s methods. I 1598 he served Tycho Brahe as a courier of gifts to Joseph Scaliger in Leiden. 1602-10 professor at Copenhagen University. From 1610 bishop of Aalborg. (Christianson 2000, 340-43)."
 
[riddershusen_christian_1582]
