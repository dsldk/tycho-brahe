[pontanus_johannes_isacius_1571]
  name = "Johannes Isacius Pontanus"
  sortname = "Pontanus, Johannes Isacius"
  lifetime = "1571-1639"
  description = "(Hans Isaksen, Jan Isaacsz, Johannes Hellespontius).  Danish-Dutch historian, born in Elsinore as son of a Dutch merchant Isaac Pietersz. Amanuensis to Tycho Brahe 1593-95. After extensive studies abroad he was back in Denmark in 1598-99. Soon after he was preceptor to three of Tycho’s relatives during their grand tour: Erik Stensen Brahe (d. 1631), Jørgen Stensen Brahe (1585-1661) and Falk Axelsen Brahe (1581-1625). Settled in Holland as a teacher in Harderwijk, where he started his production of historical works. In 1618 he was appointed royal Danish historiographer. In 1631 he published a history of Denmark, _Rerum Danicarum Historia_. Brother of the painter Pieter Isaacsz (1569-1625). (Christianson 2000, 337-339)."
 
[posse_joran_1556]
  name = "Jöran Knutsson Posse"
