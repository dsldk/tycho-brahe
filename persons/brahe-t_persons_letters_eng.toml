  sortname = "Rosenkrantz"
  lifetime = "-1589-"
  description = "Unidentified. Perhaps Frederik Rosenkrantz (1571-1602), who was in Wittenberg in 1586-87 and in Padua 1589, or Jacob Rosenkrantz (1567-1616), who was abroad in the same period (in Padua 1587)"
 
[rosenkrantz_frederik_1571]
  name = "Frederik Rosenkrantz"
  sortname = "Rosenkrantz, Frederik"
  lifetime = "1571-1602"
  description = "Danish nobleman. Sentenced to lose his honour and two fingers for after seducing one of the queen’s maids of honour, Rigborg Brockenhuus. The sentence was mitigated, and instead he was ordered to fight the Turks in Hungary. Son of Holger Rosenkrantz (1517-75) and Karen Gyldenstierne. "
 
[rosenkrantz_holger_1574]
  name = "Holger Rosenkrantz (the Learned)"
  sortname = "Rosenkrantz, Holger"
  lifetime = "1574-1642"
  description = "Danish nobleman, member of the privy council and theologian. Son of Jørgen Rosenkrantz (1523-96), married in 1598 to Sophie Axelsdatter Brahe, Tycho Brahe’s niece. After studies abroad in Rostock and Wittenberg 1590-95 he worked in the chancellery 1597. He was a close friend of Tycho Brahe, and in Tycho’s later years her regularly advised him on political and strategic matters. At his manor Rosenholm he educated e series of noble children and young people within an aristocratic learned milieu reminiscent of Uraniborg. Developed his own Lutheran theology which he explained in several learned works. (Christianson 2000, 344-46)"
 
[rosenkrantz_jacob_1567]
