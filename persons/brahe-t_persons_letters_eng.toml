[rothmann_christopher_1550]
  name = "Christopher Rothmann"
  sortname = "Rothmann, Christopher"
  lifetime = "1550-c. 1608"
  description = "German astronomer. Court astronomer to Landgrave William IV of Hesse-Kassel 1584-90. Visited Tycho Brahe on Hven for a month in 1590 and subsequently spent the rest of his in his hometown Bernburg, presumably due to illness. Tycho Brahe published his correspondence with Rothmann and the Landgrave in _Epistolae Astronomicae_ (1596)."
 
